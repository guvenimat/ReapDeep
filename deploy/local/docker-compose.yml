name: reapdeep

x-otel-endpoint: &otel-endpoint http://lgtm:4317
x-postgres-connection: &postgres-connection Host=postgres;Database=reapdeep;Username=reapdeep;Password=${POSTGRES_PASSWORD:?Missing .env - run run-local.ps1 or copy .env.example to .env}
x-query-api-environment: &query-api-environment
  ConnectionStrings__Postgres: *postgres-connection
  ConnectionStrings__StarRocks: Server=starrocks;Port=9030;User ID=reapdeep_query;Password=${STARROCKS_QUERY_PASSWORD:?Missing STARROCKS_QUERY_PASSWORD in .env};Database=analytics;ConnectionReset=false;Pooling=true;MaximumPoolSize=50
  QueryApi__AllowExplain: "true"
  Alerts__PollSeconds: "5"
  Alerts__AllowPrivateWebhooks: "true"
  Alerts__RetryDelaysSeconds: "3,3,3"
  Auth__BootstrapEmail: ${ADMIN_EMAIL:-admin@reapdeep.local}
  Auth__BootstrapPassword: ${ADMIN_PASSWORD:?Missing ADMIN_PASSWORD in .env - run run-local.ps1 or smoke-test.sh}
  Auth__SecureCookie: "false"
  ForwardedHeaders__TrustedNetworks: 172.16.0.0/12
  OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Missing REDIS_PASSWORD in .env - run run-local.ps1},abortConnect=false
  Alerts__RunJob: "false"

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: reapdeep-kafka
    mem_limit: 768m
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.0
    container_name: reapdeep-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic events         --partitions 6 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic person_updates --partitions 6 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic person_distinct_id_updates --partitions 6 --replication-factor 1
        $$T --bootstrap-server kafka:29092 --create --if-not-exists --topic events_dead_letter --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        $$T --bootstrap-server kafka:29092 --list
    restart: "no"

  starrocks:
    image: starrocks/allin1-ubuntu:4.0.8
    container_name: reapdeep-starrocks
    mem_limit: 3500m
    command: ["sh", "-c", "cp /config/fe.conf starrocks/fe/conf/fe.conf && cp /config/be.conf starrocks/be/conf/be.conf && exec ./entrypoint.sh"]
    ports:
      - "127.0.0.1:9030:9030"
      - "127.0.0.1:8030:8030"
      - "127.0.0.1:8040:8040"
    volumes:
      - starrocks-fe-meta:/data/deploy/starrocks/fe/meta
      - starrocks-be-storage:/data/deploy/starrocks/be/storage
      - ./starrocks:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW BACKENDS\\G' | grep -q 'Alive: true'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  migrate:
    build:
      context: ../../src
      dockerfile: ReapDeep.Migrations/Dockerfile
    image: reapdeep-migrate
    container_name: reapdeep-migrate
    depends_on:
      postgres:
        condition: service_healthy
      starrocks:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: *postgres-connection
      ConnectionStrings__StarRocksAdmin: Server=starrocks;Port=9030;User ID=root;ConnectionReset=false
      READ_API_KEY: ${READ_API_KEY:?Missing .env - run run-local.ps1 or copy .env.example to .env}
      STARROCKS_QUERY_PASSWORD: ${STARROCKS_QUERY_PASSWORD:?Missing STARROCKS_QUERY_PASSWORD in .env - run run-local.ps1 or smoke-test.sh}
      STARROCKS_JOBS_PASSWORD: ${STARROCKS_JOBS_PASSWORD:?Missing STARROCKS_JOBS_PASSWORD in .env - run run-local.ps1 or smoke-test.sh}
      STARROCKS_OPS_PASSWORD: ${STARROCKS_OPS_PASSWORD:?Missing STARROCKS_OPS_PASSWORD in .env - run run-local.ps1 or smoke-test.sh}
      STARROCKS_ALERTS_PASSWORD: ${STARROCKS_ALERTS_PASSWORD:?Missing STARROCKS_ALERTS_PASSWORD in .env - run run-local.ps1 or smoke-test.sh}
    restart: "no"

  redis:
    image: redis:8.8.4-alpine
    container_name: reapdeep-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Missing REDIS_PASSWORD in .env - run run-local.ps1}", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Missing REDIS_PASSWORD in .env - run run-local.ps1}

  postgres:
    image: postgres:17
    container_name: reapdeep-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: reapdeep
      POSTGRES_USER: reapdeep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing .env - run run-local.ps1 or copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reapdeep -d reapdeep"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: ../../src
      dockerfile: ReapDeep.Ingestion/Dockerfile
    image: reapdeep-ingestion
    container_name: reapdeep-ingestion
    profiles: ["app"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      Kafka__BootstrapServers: kafka:29092
      ConnectionStrings__Postgres: *postgres-connection
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Missing REDIS_PASSWORD in .env - run run-local.ps1},abortConnect=false
      OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  person-worker:
    build:
      context: ../../src
      dockerfile: ReapDeep.PersonWorker/Dockerfile
    image: reapdeep-person-worker
    container_name: reapdeep-person-worker
    profiles: ["app"]
    environment:
      Kafka__BootstrapServers: kafka:29092
      ConnectionStrings__Postgres: *postgres-connection
      ConnectionStrings__StarRocks: Server=starrocks;Port=9030;User ID=reapdeep_jobs;Password=${STARROCKS_JOBS_PASSWORD:?Missing STARROCKS_JOBS_PASSWORD in .env};Database=analytics;ConnectionReset=false
      Deletion__IntervalSeconds: "30"
      Deletion__MinAgeSeconds: "20"
      Deletion__TombstoneSeconds: "60"
      Cohorts__PollSeconds: "5"
      Cohorts__MaxRefreshSeconds: "30"
      Recommendations__PollSeconds: "10"
      Recommendations__RefreshSeconds: "60"
      ConnectionStrings__StarRocksOps: Server=starrocks;Port=9030;User ID=reapdeep_ops;Password=${STARROCKS_OPS_PASSWORD:?Missing STARROCKS_OPS_PASSWORD in .env};Database=analytics
      RoutineLoad__CheckSeconds: "10"
      OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    healthcheck:
      test: ["CMD", "bash", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/reapdeep-heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  recommender:
    build:
      context: ../../src
      dockerfile: ReapDeep.Recommender/Dockerfile
    image: reapdeep-recommender
    container_name: reapdeep-recommender
    profiles: ["app"]
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      ConnectionStrings__Postgres: *postgres-connection
      Recommender__RefreshSeconds: "5"
      OTEL_EXPORTER_OTLP_ENDPOINT: *otel-endpoint
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8002 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  query-api:
    build:
      context: ../../src
      dockerfile: ReapDeep.QueryApi/Dockerfile
    image: reapdeep-query-api
    container_name: reapdeep-query-api
    profiles: ["app"]
    ports:
      - "127.0.0.1:8001:8080"
    environment: *query-api-environment
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  alert-runner:
    image: reapdeep-query-api
    container_name: reapdeep-alert-runner
    profiles: ["app"]
    environment:
      <<: *query-api-environment
      ConnectionStrings__StarRocks: Server=starrocks;Port=9030;User ID=reapdeep_alerts;Password=${STARROCKS_ALERTS_PASSWORD:?Missing STARROCKS_ALERTS_PASSWORD in .env};Database=analytics;ConnectionReset=false;Pooling=true;MaximumPoolSize=4
      Alerts__RunJob: "true"
      OTEL_SERVICE_NAME: reapdeep-alert-runner
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      query-api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  query-api-2:
    image: reapdeep-query-api
    container_name: reapdeep-query-api-2
    profiles: ["scale"]
    ports:
      - "127.0.0.1:8003:8080"
    environment: *query-api-environment
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:0.37.0
    container_name: reapdeep-lgtm
    mem_limit: 1536m
    profiles: ["app"]
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/reapdeep.yaml:ro
      - ./grafana/reapdeep-overview.json:/otel-lgtm/reapdeep-overview.json:ro
    restart: unless-stopped

  dashboard:
    build: ../../dashboard
    image: reapdeep-dashboard
    container_name: reapdeep-dashboard
    profiles: ["app"]
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - query-api

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: reapdeep-kafka-ui
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  starrocks-fe-meta:
  starrocks-be-storage:
  postgres-data:
